[project]
name = "tala"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, DJ: Django checks,
# S: security (flake8-bandit)
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S101", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["core", "accounts", "classroom", "attendance", "grades"]
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*", "*/migrations/*", "conftest.py", "manage.py", "config/wsgi.py", "config/asgi.py",
    "bin/*",
]
