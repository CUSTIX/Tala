# Render Blueprint: one free web service (Docker), database on Neon (free).
# The database URL is set in the Render dashboard, never here (sync: false). See docs/deploy.md.
services:
  - type: web
    name: tala-ph
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /livez/
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions passes
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_HTTPS
        value: "true"
      - key: DJANGO_STATIC_MANIFEST
        value: "true"
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
